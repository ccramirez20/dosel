version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Un PR por grupo en vez de uno por paquete: menos ruido, mismo resultado.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # eslint-config-next@16 todavía trae eslint-plugin-react y typescript-eslint que
      # no arrancan con eslint 10 ni con TypeScript 7 (probado: ambos rompen `pnpm lint`).
      # Quitar estas dos entradas cuando eslint-config-next los soporte.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
